name: Backend Integration Tests

on:
  push:
    branches: ["main", "develop"]
    paths: ["backend/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["backend/**"]

jobs:
  integration-tests-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: makerbox_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Migrar base de datos (Prisma)
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5433/makerbox_db?schema=public

      - name: Ejecutar pruebas de integración
        run: npm test -- tests/integration/
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5433/makerbox_db?schema=public
          NODE_ENV: test

      - name: Generar reporte de cobertura
        run: npm run test:coverage -- tests/integration/
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5433/makerbox_db?schema=public
          NODE_ENV: test

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: backend-integration
          fail_ci_if_error: false