name: Backend CI

on:
  push:
    branches: ["main"]
    paths: ["backend/**"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**"]

jobs:
  validar-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: makerbox_db
        ports:
          - 5433:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Probar conexión y esquema de BD (Prisma)

        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5433/makerbox_db?schema=public
