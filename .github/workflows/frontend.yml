name: Frontend CI

on:
  push:
    branches: ["main", "develop", "feature-*", "feature/**"]
    paths: ["frontend/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["frontend/**"]

jobs:
  validar-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter (Airbnb + Prettier)
        run: npm run lint

      - name: Ejecutar pruebas de integración y cobertura
        run: npm run test:coverage

      - name: Validar compilación (Build)
        run: npm run build

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          slug: tomasxrp/proyecto-makerbox-G07
          fail_ci_if_error: true

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
